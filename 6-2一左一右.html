<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一左一右  何汶军</title>
    <style>
        *{
            margin: 0;
            padding: 0;

        }
        .title{
        width: 500px;
        height: 33px;
        line-height: 33px;
        padding-left: 10px;
        padding-right: 10px;
        margin: 50px;


        }
        .title h2{
            font-size: 14px;
             color: #333;
                 
        }
        .title a{
             font-size: 12px;
             color: #999;
             text-decoration: none;
             
        }
        .title:first-child{
            border:1px solid #ddd;
            display: flex;
            justify-content: space-between;

        }
        .title:nth-child(2){
            display: flex;
            border-top:1px solid #ddd;
        }
        .title:nth-child(2) h2{
            flex-grow: 1;
            /*占剩余所有空间*/
        }
        .title:nth-child(3){
            position: relative;
            border-bottom:2px solid #ddd;
        }
        .title:nth-child(3) a{
            
            position: absolute;
            right: 16px;
            top: 0;

        }

    </style>
</head>
<body>
    <div class="title">
        <h2>何汶军的标题</h2>
        <a href="#">更多</a>
    </div>

     <div class="title">
        <h2>何汶军的标题</h2>
        <a href="#">更多</a>
    </div>

     <div class="title">
        <h2>何汶军的标题</h2>
        <a href="#">更多</a>
    </div>
</body>
</html>
