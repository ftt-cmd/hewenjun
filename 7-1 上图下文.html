<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*  全局css  */
        *{margin: 0;padding: 0;}
        ul{list-style: none;}
        img{
            display: block;
        }
        .slist{ 
            display: flex;
            margin:8px;
        }
        .slist li{ 
            width:30%;
            margin-right:3px;
            flex-grow:1;
            /*相对*/
            position: relative;
        }
        .slist img{ 
            width:100%;
        }
        .slist p{ 
            font-size: 14px;
            text-align: center;
            line-height: 24px;
            /*绝对定位*/
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            background: rgba(0,0,0,0.5);
            color: #fff;
            /*加粗*/
            font-weight: bold;
        }


    </style>
</head>
<body>
    <ul class="slist">
        <li>
            <img src="./img/1.jpg">
            <p>何汶军的标题1</p>
        </li>

        <li>
            <img src="./img/2.jpg">
            <p>何汶军的标题2</p>
        </li>
        
        <li>
            <img src="./img/3.jpg">
            <p>何汶军的标题3</p>
        </li>
    </ul>
</body>
</html>
