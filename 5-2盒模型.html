<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒模型,框模型，box  model</title>
</head>
<body>
    <div class="a">114何汶军</div>
    <div class="b">114何汶军</div>
    <div class="c">114何汶军</div>
    <style>
        boby ,u1,p,h1,h2,h3,h4,h5,h6{
            margin: 0;
            padding: 0;
        }
        /*j尽量少用*通配符*/
        u1{
            list-style: none;
        }
        .a{
            width: 500px;
            height: 300px;
            border: 2px dotted red;
            padding: 70px 60px 50px 40px; /*上 右 下 左*/
            margin: 40px auto;

        }
        .b{
            width: 500px;
            height: 300px;
            border: 2px dashed blue;
            margin: 50px auto;
        }
        .c {
          width: 500px;
          height: 300px;
          border: 2px solid green;  /* 实线，颜色自选，与 a、b 区分开 */
          margin: 60px auto;
          }

        
    </style>
