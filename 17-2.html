  功能名称：fetch 获取用户列表（接口：https://jsonplaceholder.typicode.com/users）
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>17-2 fetch 获取用户列表</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font: 14px/1.6 "Microsoft YaHei", sans-serif; color: #333; background: #f5f6f7; padding: 16px 0 60px; }

  .hwj_back { display: inline-block; margin: 0 0 12px 24px; padding: 6px 14px; background: #2563eb; color: #fff; border-radius: 4px; font-size: 13px; text-decoration: none; }
  .hwj_back:hover { background: #1d4ed8; }

  .hwj_wrap { width: 1060px; margin: 0 auto; }
  .hwj_head { padding: 18px 0 14px; }
  .hwj_head h1 { font-size: 24px; }
  .hwj_head p { color: #666; margin-top: 6px; }
  .hwj_head code { background: #eef2ff; padding: 2px 8px; border-radius: 4px; color: #4338ca; font-size: 12px; }

  .hwj_toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .hwj_btn { padding: 8px 20px; background: #2563eb; color: #fff; border: 0; border-radius: 4px; font-size: 13px; cursor: pointer; font-family: inherit; }
  .hwj_btn:hover { background: #1d4ed8; }
  .hwj_btn.hwj_ghost { background: #fff; color: #2563eb; border: 1px solid #2563eb; }
  .hwj_status { color: #666; font-size: 13px; }

  .hwj_card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 6px; }

  table.hwj_table { width: 100%; border-collapse: collapse; }
  .hwj_table th, .hwj_table td { padding: 10px 12px; border-bottom: 1px solid #f0f0f0; text-align: left; font-size: 13px; }
  .hwj_table th { background: #f9fafb; color: #555; white-space: nowrap; }
  .hwj_table tbody tr:hover { background: #f0f7ff; }
  .hwj_table .hwj_id { color: #2563eb; font-weight: bold; }
  .hwj_table a { color: #2563eb; }
  .hwj_table .hwj_mail { color: #059669; }

  .hwj_tip { margin-top: 12px; color: #999; font-size: 12px; }

  /* 原始 JSON 查看器 */
  .hwj_json { display: none; margin-top: 14px; background: #0f172a; color: #7dd3fc; font-family: Consolas, monospace; font-size: 12px; line-height: 1.7; padding: 14px 16px; border-radius: 8px; max-height: 420px; overflow: auto; white-space: pre; }
  .hwj_json.hwj_show { display: block; }
</style>
</head>
<body>

<a class="hwj_back" href="index.html">← 返回首页</a>

<div class="hwj_wrap">
  <div class="hwj_head">
    <h1>fetch 获取用户列表</h1>
    <p>接口：<code>GET https://jsonplaceholder.typicode.com/users</code>（支持跨域，返回 JSON 数组）</p>
  </div>

  <div class="hwj_toolbar">
    <button class="hwj_btn" id="hwj_loadBtn" onclick="hwj_loadUsers()">加载用户数据</button>
    <button class="hwj_btn hwj_ghost" onclick="hwj_toggleJson()">查看原始 JSON</button>
    <span class="hwj_status" id="hwj_status"></span>
  </div>

  <div class="hwj_card">
    <table class="hwj_table">
      <thead>
        <tr>
          <th>ID</th><th>姓名</th><th>用户名</th><th>邮箱</th>
          <th>电话</th><th>网站</th><th>公司</th><th>城市</th>
        </tr>
      </thead>
      <tbody id="hwj_tbody">
        <tr><td colspan="8" style="text-align:center;color:#999;padding:30px 0;">点击"加载用户数据"按钮获取接口数据</td></tr>
      </tbody>
    </table>
  </div>

  <p class="hwj_tip">流程：fetch(url) → 响应对象 → resp.json() 解析为 JS 数组 → 动态生成表格行。</p>
  <pre class="hwj_json" id="hwj_jsonBox"></pre>
</div>

<script>
  var HWJ_URL = 'https://jsonplaceholder.typicode.com/users';

  /* 转义 HTML 特殊字符，防注入 */
  function hwj_esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  /* 主流程：fetch 加载并渲染 */
  function hwj_loadUsers() {
    var tbody = document.getElementById('hwj_tbody');
    var status = document.getElementById('hwj_status');
    var btn = document.getElementById('hwj_loadBtn');

    status.textContent = '⏳ 正在请求接口…';
    btn.disabled = true;
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#2563eb;padding:30px 0;">加载中，请稍候…</td></tr>';

    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, 15000);   // 15秒超时

    fetch(HWJ_URL, { signal: ctrl.signal })
      .then(function (resp) {
        clearTimeout(timer);
        if (!resp.ok) {                      // HTTP 状态码非 2xx
          throw new Error('HTTP ' + resp.status);
        }
        return resp.json();                  // 解析 JSON → JS 数组
      })
      .then(function (users) {
        status.textContent = '✓ 获取成功，共 ' + users.length + ' 位用户';
        btn.disabled = false;

        tbody.innerHTML = users.map(function (u) {
          return '<tr>' +
                   '<td class="hwj_id">' + u.id + '</td>' +
                   '<td>' + hwj_esc(u.name) + '</td>' +
                   '<td>@' + hwj_esc(u.username) + '</td>' +
                   '<td class="hwj_mail">' + hwj_esc(u.email) + '</td>' +
                   '<td>' + hwj_esc(u.phone) + '</td>' +
                   '<td><a href="http://' + hwj_esc(u.website) + '" target="_blank">' + hwj_esc(u.website) + '</a></td>' +
                   '<td>' + hwj_esc(u.company.name) + '</td>' +
                   '<td>' + hwj_esc(u.address.city) + '</td>' +
                 '</tr>';
        }).join('');

        document.getElementById('hwj_jsonBox').textContent = JSON.stringify(users, null, 2);
      })
      .catch(function (err) {                 // 网络失败 / 超时 / 解析失败
        clearTimeout(timer);
        var msg = (err.name === 'AbortError') ? '请求超时（15秒），请检查是否已开启代理' : err.message;
        status.textContent = '✗ 获取失败：' + msg;
        btn.disabled = false;
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#dc2626;padding:30px 0;">' +
          '加载失败（' + err.message + '），请检查网络后点击按钮重试</td></tr>';
      });
  }

  /* 原始 JSON 折叠/展开 */
  function hwj_toggleJson() {
    document.getElementById('hwj_jsonBox').classList.toggle('hwj_show');
  }

  /* 页面打开即自动加载一次 */
  hwj_loadUsers();
</script>

</body>
</html>
