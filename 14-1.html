<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>何汶军  JavaScript</h2>
    <script>
        // 输出，何汶军，你好，document.alert.console三种方式
        document.write("何汶军，你好");
        alert("何汶军，你好");
        console.log("何汶军，你好");
        //confirm和prompt函数
        confirm("你确定吗？");
        prompt("请输入你的姓名");
        //prompt函数返回用户输入的内容
    </script>
</body>
</html>
