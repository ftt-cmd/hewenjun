<!--
  姓名：袁磊
  日期：2026-10-26
  功能名称：数7游戏 — 100个盒子，7的倍数或包含数字7的显示为空盒子，其余显示数字+姓名
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>15-1 数7游戏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #f0f4f8;
    padding: 30px 20px;
    min-height: 100vh;
  }

  .hwj_back {
    display: inline-block;
    margin-bottom: 16px;
    padding: 6px 14px;
    background: #4a90d9;
    color: #fff;
    text-decoration: none;
    border-radius: 4px;
    font-size: 14px;
  }
  .hwj_back:hover { background: #2c5f8a; }

  .hwj_title {
    text-align: center;
    margin-bottom: 24px;
    color: #333;
    font-size: 28px;
  }

  .hwj_container {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 10px;
    max-width: 900px;
    margin: 0 auto;
  }

  .hwj_box {
    aspect-ratio: 1 / 1;
    border: 2px solid #4a90d9;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #fff;
    transition: transform 0.15s ease;
    cursor: default;
    padding: 4px;
    text-align: center;
  }

  .hwj_box:hover { transform: scale(1.05); }

  /* 满足数7规则 → 空盒子 */
  .hwj_box.hwj_empty {
    background: linear-gradient(135deg, #e8e8e8, #d0d0d0);
    border-color: #999;
  }

  .hwj_num {
    font-size: clamp(14px, 2vw, 22px);
    font-weight: bold;
    color: #2c5f8a;
    line-height: 1.2;
  }

  .hwj_name {
    font-size: clamp(11px, 1.5vw, 16px);
    color: #555;
    margin-top: 4px;
    line-height: 1.2;
  }
</style>
</head>
<body>

<a class="hwj_back" href="index.html">← 返回首页</a>

<h1 class="hwj_title">数7游戏 — 100个盒子</h1>

<div class="hwj_container" id="hwj_container"></div>

<script>
  // 判断是否满足数7规则：7的倍数 或 包含数字7
  function hwj_isBadNumber(n) {
    if (n % 7 === 0) return true;            // 7的倍数
    if (String(n).includes('7')) return true; // 包含7（末尾是7也在此覆盖）
    return false;
  }

  const hwj_container = document.getElementById('hwj_container');

  for (let hwj_i = 1; hwj_i <= 100; hwj_i++) {
    const hwj_box = document.createElement('div');
    hwj_box.className = 'hwj_box';

    if (hwj_isBadNumber(hwj_i)) {
      // 满足规则 → 空盒子
      hwj_box.classList.add('hwj_empty');
    } else {
      // 不满足规则 → 显示数字 + 姓名
      hwj_box.innerHTML =
        '<span class="hwj_num">' + hwj_i + '</span>' +
        '<span class="hwj_name">何汶军</span>';
    }

    hwj_container.appendChild(hwj_box);
  }
</script>

</body>
</html>
